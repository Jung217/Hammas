<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <defs>
    <clipPath id="bgClip">
      <rect width="64" height="64" rx="14" ry="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bgClip)">
    <!-- background -->
    <rect width="64" height="64" fill="#d97706"/>
    <!-- top highlight -->
    <ellipse cx="32" cy="0" rx="40" ry="14" fill="#ffffff" opacity="0.14"/>

    <!-- body (lower) -->
    <ellipse cx="32" cy="52" rx="22" ry="14" fill="#fbc676"/>
    <!-- belly patch -->
    <ellipse cx="32" cy="55" rx="15" ry="11" fill="#fff3dd"/>

    <!-- ears (outer) -->
    <ellipse cx="14" cy="14" rx="6.5" ry="7.5" fill="#7a4002" transform="rotate(-22 14 14)"/>
    <ellipse cx="50" cy="14" rx="6.5" ry="7.5" fill="#7a4002" transform="rotate( 22 50 14)"/>
    <!-- ears (inner) -->
    <ellipse cx="14" cy="16" rx="2.6" ry="3.6" fill="#f49aa3" transform="rotate(-22 14 16)"/>
    <ellipse cx="50" cy="16" rx="2.6" ry="3.6" fill="#f49aa3" transform="rotate( 22 50 16)"/>

    <!-- head -->
    <circle cx="32" cy="28" r="18" fill="#fbc676"/>
    <!-- snout (lighter front) -->
    <ellipse cx="32" cy="33" rx="11" ry="7" fill="#fff3dd"/>

    <!-- cheek blush -->
    <circle cx="18" cy="32" r="3.5" fill="#f49aa3" opacity="0.55"/>
    <circle cx="46" cy="32" r="3.5" fill="#f49aa3" opacity="0.55"/>

    <!-- eyes -->
    <circle cx="25" cy="25" r="3"   fill="#0e0e12"/>
    <circle cx="39" cy="25" r="3"   fill="#0e0e12"/>
    <circle cx="26" cy="24" r="1"   fill="#ffffff"/>
    <circle cx="40" cy="24" r="1"   fill="#ffffff"/>

    <!-- nose -->
    <ellipse cx="32" cy="32" rx="2" ry="1.5" fill="#7a3915"/>
    <!-- mouth -->
    <path d="M 28 34.5 Q 32 37.5 36 34.5"
          stroke="#5c3315" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- paws (front, holding the pistol) -->
    <ellipse cx="20" cy="48" rx="4.5" ry="3.5" fill="#fbc676"/>
    <ellipse cx="44" cy="48" rx="4.5" ry="3.5" fill="#fbc676"/>

    <!-- ===== Pistol ===== -->
    <!-- frame -->
    <rect x="17" y="44" width="27" height="8" rx="1.2" fill="#0e0e12"/>
    <!-- slide highlight -->
    <rect x="18" y="44.5" width="25" height="2.2" rx="0.5" fill="#3a3a42"/>
    <!-- barrel -->
    <rect x="42" y="45.5" width="5.5" height="3"   fill="#3a3a42"/>
    <rect x="45" y="46"   width="3"   height="2"   fill="#0a0a0e"/>
    <!-- grip -->
    <path d="M 23 51.5 L 22 58.5 L 30 58.5 L 31 51.5 Z" fill="#0a0a0e"/>
    <!-- trigger guard -->
    <circle cx="27.5" cy="52.5" r="2.2" fill="none" stroke="#0a0a0e" stroke-width="1.4"/>

    <!-- muzzle flash -->
    <polygon points="47.5,47 54.5,43.5 51.5,47 56.5,47 51.5,48 54.5,51.5 47.5,48"
             fill="#ffd84a"/>
    <polygon points="49,47 53,46 51.5,47 53,47.5 51.5,47.5 53,48.5 49,47.5"
             fill="#ffffff"/>
  </g>
</svg>
